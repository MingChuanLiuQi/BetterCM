name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop:
        description: Run checks on an explicitly configured interactive desktop runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test, audit dependencies and publish
        shell: pwsh
        run: ./verify.ps1 -SkipDesktopChecks
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: artifacts/qa
      - name: Ensure Inno Setup 6.5+
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) {
            $installed = [Diagnostics.FileVersionInfo]::GetVersionInfo($compiler)
            if ($installed.FileMajorPart -gt 6 -or ($installed.FileMajorPart -eq 6 -and $installed.FileMinorPart -ge 5)) {
              Write-Output ('Using installed Inno Setup ' + $installed.FileVersion)
              exit 0
            }
          }
          choco install innosetup --version=6.5.4 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not installed at the expected path.' }
      - name: Compile internal unsigned installer
        shell: pwsh
        run: ./Build-Installer.ps1 -SkipDesktopChecks -ReuseVerifiedPublish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: internal-unsigned-installer
          path: |
            artifacts/internal
            artifacts/qa/payload-*.json
  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: [self-hosted, Windows, X64, interactive-desktop]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./verify.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-verification-reports
          path: artifacts/qa
